<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" role="img" aria-labelledby="t d">
  <title id="t">CancelTask</title>
  <desc id="d">CancelTask interrupts the Session and waits up to ten seconds for the task to read as canceled.</desc>
  <style>
    svg{--bg:#ffffff;--text:#1f2328;--muted:#59636e;--line:#d1d9e0;--band:#f6f8fa;--client:#0969da;--server:#1a7f37;--core:#8250df;--bus:#bc4c00;--remote:#bf3989;--on:#ffffff}
    @media (prefers-color-scheme:dark){svg{--bg:#0d1117;--text:#e6edf3;--muted:#9198a1;--line:#3d444d;--band:#151b23;--client:#4493f8;--server:#3fb950;--core:#ab7df8;--bus:#f0883e;--remote:#f778ba;--on:#0d1117}}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--text)}
    .bg{fill:var(--bg)}
    .box{fill:var(--bg);stroke-width:1.5}
    .title{font-size:14px;font-weight:600}
    .sub{font-size:11px;fill:var(--muted)}
    .band{fill:var(--band)}
    .phase{font-size:12px;font-weight:600;fill:var(--muted)}
    .life{stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 4}
    .open{fill-opacity:.16}
    .msg{stroke-width:1.75;fill:none}
    .pname{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:700}
    .cap{font-size:11.5px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
    .note{fill:var(--bg);stroke-width:1.2;stroke-dasharray:3 2}
    .ntext,.ptext{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px}
    .ptext{font-size:11px;font-weight:600;fill:var(--on)}
    .pkt{opacity:0}
    .legend{font-size:11px;fill:var(--muted)}
    @keyframes d1{0%,3.08%{stroke-dashoffset:240;opacity:1}10.77%,96%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes f1{0%,3.08%{transform:translateX(0);opacity:0}3.69%{opacity:1}10.38%{opacity:1}10.77%{transform:translateX(240px);opacity:1}13.08%,100%{transform:translateX(240px);opacity:0}}
    @keyframes c1{0%,9.62%{opacity:0}11.92%,96%{opacity:1}100%{opacity:0}}
    @keyframes n2{0%,13.08%{opacity:0}15.38%,96%{opacity:1}100%{opacity:0}}
    @keyframes n3{0%,21.54%{opacity:0}23.85%,96%{opacity:1}100%{opacity:0}}
    @keyframes d4{0%,30.00%{stroke-dashoffset:240;opacity:1}37.69%,96%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes f4{0%,30.00%{transform:translateX(0);opacity:0}30.62%{opacity:1}37.31%{opacity:1}37.69%{transform:translateX(240px);opacity:1}40.00%,100%{transform:translateX(240px);opacity:0}}
    @keyframes c4{0%,36.54%{opacity:0}38.85%,96%{opacity:1}100%{opacity:0}}
    @keyframes d5{0%,40.00%{stroke-dashoffset:480;opacity:1}47.69%,96%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes f5{0%,40.00%{transform:translateX(0);opacity:0}40.62%{opacity:1}47.31%{opacity:1}47.69%{transform:translateX(480px);opacity:1}50.00%,100%{transform:translateX(480px);opacity:0}}
    @keyframes c5{0%,46.54%{opacity:0}48.85%,96%{opacity:1}100%{opacity:0}}
    @keyframes d6{0%,50.00%{stroke-dashoffset:240;opacity:1}57.69%,96%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes f6{0%,50.00%{transform:translateX(0);opacity:0}50.62%{opacity:1}57.31%{opacity:1}57.69%{transform:translateX(240px);opacity:1}60.00%,100%{transform:translateX(240px);opacity:0}}
    @keyframes c6{0%,56.54%{opacity:0}58.85%,96%{opacity:1}100%{opacity:0}}
    @keyframes d7{0%,60.00%{stroke-dashoffset:480;opacity:1}67.69%,96%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes f7{0%,60.00%{transform:translateX(0);opacity:0}60.62%{opacity:1}67.31%{opacity:1}67.69%{transform:translateX(-480px);opacity:1}70.00%,100%{transform:translateX(-480px);opacity:0}}
    @keyframes c7{0%,66.54%{opacity:0}68.85%,96%{opacity:1}100%{opacity:0}}
    @keyframes d8{0%,70.00%{stroke-dashoffset:240;opacity:1}77.69%,96%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes f8{0%,70.00%{transform:translateX(0);opacity:0}70.62%{opacity:1}77.31%{opacity:1}77.69%{transform:translateX(-240px);opacity:1}80.00%,100%{transform:translateX(-240px);opacity:0}}
    @keyframes c8{0%,76.54%{opacity:0}78.85%,96%{opacity:1}100%{opacity:0}}
    @keyframes b0{0%,3.08%{opacity:0}5.38%,96%{opacity:1}100%{opacity:0}}
    @keyframes b1{0%,40.00%{opacity:0}42.31%,96%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.anim{animation:none!important}.pkt{display:none}}
  </style>
  <rect width="960" height="510" class="bg"/>
  <rect x="12" y="18" width="216" height="50" rx="8" class="box" style="stroke:var(--client)"/>
  <text x="120" y="39" class="title" text-anchor="middle">A2A client</text>
  <text x="120" y="57" class="sub" text-anchor="middle">an a2a-sdk app, or OpenCode's a2a tool</text>
  <rect x="252" y="18" width="216" height="50" rx="8" class="box" style="stroke:var(--server)"/>
  <text x="360" y="39" class="title" text-anchor="middle">A2A handler</text>
  <text x="360" y="57" class="sub" text-anchor="middle">server/src/handlers/a2a.ts</text>
  <rect x="492" y="18" width="216" height="50" rx="8" class="box" style="stroke:var(--core)"/>
  <text x="600" y="39" class="title" text-anchor="middle">Session runtime</text>
  <text x="600" y="57" class="sub" text-anchor="middle">core: Session, Permission, Form</text>
  <rect x="732" y="18" width="216" height="50" rx="8" class="box" style="stroke:var(--bus)"/>
  <text x="840" y="39" class="title" text-anchor="middle">Bus</text>
  <text x="840" y="57" class="sub" text-anchor="middle">live Session and permission events</text>
  <line x1="120" y1="68" x2="120" y2="464" class="life"/>
  <line x1="360" y1="68" x2="360" y2="464" class="life"/>
  <line x1="600" y1="68" x2="600" y2="464" class="life"/>
  <line x1="840" y1="68" x2="840" y2="464" class="life"/>
  <rect x="114" y="150" width="12" height="294" rx="3" class="open anim" style="fill:var(--client);animation:b0 13.00s linear infinite"/>
  <rect x="354" y="302" width="12" height="100" rx="3" class="open anim" style="fill:var(--server);animation:b1 13.00s linear infinite"/>
  <rect x="16" y="96" width="928" height="24" rx="5" class="band"/>
  <text x="28" y="112" class="phase">C2 · CancelTask on a running task</text>
  <line x1="120" y1="158" x2="353" y2="158" class="msg anim" style="stroke:var(--client);stroke-dasharray:240;animation:d1 13.00s linear infinite"/>
  <g class="anim" style="animation:c1 13.00s linear infinite">
    <polygon points="360,158 351,153 351,163" style="fill:var(--client)"/>
    <text x="240" y="151" class="cap" text-anchor="middle"><tspan class="pname">CancelTask</tspan><tspan dx="8">{ id: ses_…:msg_… }</tspan></text>
  </g>
  <g class="pkt anim" style="animation:f1 13.00s linear infinite">
    <rect x="76" y="148" width="88" height="20" rx="10" style="fill:var(--client)"/>
    <text x="120" y="162" class="ptext" text-anchor="middle">CancelTask</text>
  </g>
  <g class="anim" style="animation:n2 13.00s linear infinite">
    <rect x="176.2" y="183" width="367.6" height="22" rx="5" class="note" style="stroke:var(--server)"/>
    <text x="360" y="198" class="ntext" text-anchor="middle">cancel(): read() · terminal → -32002 TaskNotCancelable</text>
  </g>
  <g class="anim" style="animation:n3 13.00s linear infinite">
    <rect x="221" y="217" width="278" height="22" rx="5" class="note" style="stroke:var(--server)"/>
    <text x="360" y="232" class="ntext" text-anchor="middle">submitted → sessions.cancelInbox() first</text>
  </g>
  <line x1="360" y1="268" x2="593" y2="268" class="msg anim" style="stroke:var(--server);stroke-dasharray:240;animation:d4 13.00s linear infinite"/>
  <g class="anim" style="animation:c4 13.00s linear infinite">
    <polygon points="600,268 591,263 591,273" style="fill:var(--server)"/>
    <text x="480" y="261" class="cap" text-anchor="middle"><tspan class="pname">interrupt</tspan><tspan dx="8">sessions.interrupt(sessionID)</tspan></text>
  </g>
  <g class="pkt anim" style="animation:f4 13.00s linear infinite">
    <rect x="319.5" y="258" width="81" height="20" rx="10" style="fill:var(--server)"/>
    <text x="360" y="272" class="ptext" text-anchor="middle">interrupt</text>
  </g>
  <line x1="360" y1="310" x2="833" y2="310" class="msg anim" style="stroke:var(--server);stroke-dasharray:480;animation:d5 13.00s linear infinite"/>
  <g class="anim" style="animation:c5 13.00s linear infinite">
    <polygon points="840,310 831,305 831,315" style="fill:var(--server)"/>
    <text x="600" y="303" class="cap" text-anchor="middle"><tspan class="pname">subscribe</tspan><tspan dx="8">settle(), for at most 10 seconds</tspan></text>
  </g>
  <g class="pkt anim" style="animation:f5 13.00s linear infinite">
    <rect x="319.5" y="300" width="81" height="20" rx="10" style="fill:var(--server)"/>
    <text x="360" y="314" class="ptext" text-anchor="middle">subscribe</text>
  </g>
  <line x1="600" y1="352" x2="833" y2="352" class="msg anim" style="stroke:var(--core);stroke-dasharray:240;animation:d6 13.00s linear infinite"/>
  <g class="anim" style="animation:c6 13.00s linear infinite">
    <polygon points="840,352 831,347 831,357" style="fill:var(--core)"/>
    <text x="720" y="345" class="cap" text-anchor="middle"><tspan class="pname">session.execution.interrupted</tspan><tspan dx="8">the turn stops, the Session goes idle</tspan></text>
  </g>
  <g class="pkt anim" style="animation:f6 13.00s linear infinite">
    <rect x="489.5" y="342" width="221" height="20" rx="10" style="fill:var(--core)"/>
    <text x="600" y="356" class="ptext" text-anchor="middle">session.execution.interrupted</text>
  </g>
  <line x1="840" y1="394" x2="367" y2="394" class="msg anim" style="stroke:var(--bus);stroke-dasharray:480;animation:d7 13.00s linear infinite"/>
  <g class="anim" style="animation:c7 13.00s linear infinite">
    <polygon points="360,394 369,389 369,399" style="fill:var(--bus)"/>
    <text x="600" y="387" class="cap" text-anchor="middle"><tspan class="pname">wake</tspan><tspan dx="8">read(): idle after an interrupt → canceled</tspan></text>
  </g>
  <g class="pkt anim" style="animation:f7 13.00s linear infinite">
    <rect x="817" y="384" width="46" height="20" rx="10" style="fill:var(--bus)"/>
    <text x="840" y="398" class="ptext" text-anchor="middle">wake</text>
  </g>
  <line x1="360" y1="436" x2="127" y2="436" class="msg anim" style="stroke:var(--server);stroke-dasharray:240;animation:d8 13.00s linear infinite"/>
  <g class="anim" style="animation:c8 13.00s linear infinite">
    <polygon points="120,436 129,431 129,441" style="fill:var(--server)"/>
    <text x="240" y="429" class="cap" text-anchor="middle"><tspan class="pname">task</tspan><tspan dx="8">task CANCELED (a never-delivered prompt also reads canceled)</tspan></text>
  </g>
  <g class="pkt anim" style="animation:f8 13.00s linear infinite">
    <rect x="337" y="426" width="46" height="20" rx="10" style="fill:var(--server)"/>
    <text x="360" y="440" class="ptext" text-anchor="middle">task</text>
  </g>
  <text x="16" y="490" class="legend">Shaded bar: a request still open (client side) or a wait on Bus events (handler side). Pills are messages; boxes are steps inside one component.</text>
</svg>
