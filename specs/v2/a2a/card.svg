<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 588" width="960" height="588" role="img" aria-labelledby="t d">
  <title id="t">Reading OpenCode's Agent Card</title>
  <desc id="d">A client reads the Agent Card of one Location, then asks again with If-None-Match and gets 304.</desc>
  <style>
    svg{--bg:#ffffff;--text:#1f2328;--muted:#59636e;--line:#d1d9e0;--band:#f6f8fa;--client:#0969da;--server:#1a7f37;--core:#8250df;--bus:#bc4c00;--remote:#bf3989;--on:#ffffff}
    @media (prefers-color-scheme:dark){svg{--bg:#0d1117;--text:#e6edf3;--muted:#9198a1;--line:#3d444d;--band:#151b23;--client:#4493f8;--server:#3fb950;--core:#ab7df8;--bus:#f0883e;--remote:#f778ba;--on:#0d1117}}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--text)}
    .bg{fill:var(--bg)}
    .box{fill:var(--bg);stroke-width:1.5}
    .title{font-size:14px;font-weight:600}
    .sub{font-size:11px;fill:var(--muted)}
    .band{fill:var(--band)}
    .phase{font-size:12px;font-weight:600;fill:var(--muted)}
    .life{stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 4}
    .open{fill-opacity:.16}
    .msg{stroke-width:1.75;fill:none}
    .pname{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:700}
    .cap{font-size:11.5px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
    .note{fill:var(--bg);stroke-width:1.2;stroke-dasharray:3 2}
    .ntext,.ptext{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px}
    .ptext{font-size:11px;font-weight:600;fill:var(--on)}
    .pkt{opacity:0}
    .legend{font-size:11px;fill:var(--muted)}
    @keyframes d1{0%,2.84%{stroke-dashoffset:320;opacity:1}9.93%,96%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes f1{0%,2.84%{transform:translateX(0);opacity:0}3.40%{opacity:1}9.57%{opacity:1}9.93%{transform:translateX(320px);opacity:1}12.06%,100%{transform:translateX(320px);opacity:0}}
    @keyframes c1{0%,8.87%{opacity:0}10.99%,96%{opacity:1}100%{opacity:0}}
    @keyframes n2{0%,12.06%{opacity:0}14.18%,96%{opacity:1}100%{opacity:0}}
    @keyframes n3{0%,19.86%{opacity:0}21.99%,96%{opacity:1}100%{opacity:0}}
    @keyframes d4{0%,27.66%{stroke-dashoffset:320;opacity:1}34.75%,96%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes f4{0%,27.66%{transform:translateX(0);opacity:0}28.23%{opacity:1}34.40%{opacity:1}34.75%{transform:translateX(320px);opacity:1}36.88%,100%{transform:translateX(320px);opacity:0}}
    @keyframes c4{0%,33.69%{opacity:0}35.82%,96%{opacity:1}100%{opacity:0}}
    @keyframes d5{0%,36.88%{stroke-dashoffset:320;opacity:1}43.97%,96%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes f5{0%,36.88%{transform:translateX(0);opacity:0}37.45%{opacity:1}43.62%{opacity:1}43.97%{transform:translateX(-320px);opacity:1}46.10%,100%{transform:translateX(-320px);opacity:0}}
    @keyframes c5{0%,42.91%{opacity:0}45.04%,96%{opacity:1}100%{opacity:0}}
    @keyframes n6{0%,46.10%{opacity:0}48.23%,96%{opacity:1}100%{opacity:0}}
    @keyframes d7{0%,53.90%{stroke-dashoffset:320;opacity:1}60.99%,96%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes f7{0%,53.90%{transform:translateX(0);opacity:0}54.47%{opacity:1}60.64%{opacity:1}60.99%{transform:translateX(-320px);opacity:1}63.12%,100%{transform:translateX(-320px);opacity:0}}
    @keyframes c7{0%,59.93%{opacity:0}62.06%,96%{opacity:1}100%{opacity:0}}
    @keyframes d9{0%,63.12%{stroke-dashoffset:320;opacity:1}70.21%,96%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes f9{0%,63.12%{transform:translateX(0);opacity:0}63.69%{opacity:1}69.86%{opacity:1}70.21%{transform:translateX(320px);opacity:1}72.34%,100%{transform:translateX(320px);opacity:0}}
    @keyframes c9{0%,69.15%{opacity:0}71.28%,96%{opacity:1}100%{opacity:0}}
    @keyframes d10{0%,72.34%{stroke-dashoffset:320;opacity:1}79.43%,96%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes f10{0%,72.34%{transform:translateX(0);opacity:0}72.91%{opacity:1}79.08%{opacity:1}79.43%{transform:translateX(-320px);opacity:1}81.56%,100%{transform:translateX(-320px);opacity:0}}
    @keyframes c10{0%,78.37%{opacity:0}80.50%,96%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.anim{animation:none!important}.pkt{display:none}}
  </style>
  <rect width="960" height="588" class="bg"/>
  <rect x="52" y="18" width="216" height="50" rx="8" class="box" style="stroke:var(--client)"/>
  <text x="160" y="39" class="title" text-anchor="middle">A2A client</text>
  <text x="160" y="57" class="sub" text-anchor="middle">an a2a-sdk app, or OpenCode's a2a tool</text>
  <rect x="372" y="18" width="216" height="50" rx="8" class="box" style="stroke:var(--server)"/>
  <text x="480" y="39" class="title" text-anchor="middle">A2A handler</text>
  <text x="480" y="57" class="sub" text-anchor="middle">server/src/handlers/a2a.ts</text>
  <rect x="692" y="18" width="216" height="50" rx="8" class="box" style="stroke:var(--core)"/>
  <text x="800" y="39" class="title" text-anchor="middle">Agent service</text>
  <text x="800" y="57" class="sub" text-anchor="middle">core/agent: the Location's agents</text>
  <line x1="160" y1="68" x2="160" y2="542" class="life"/>
  <line x1="480" y1="68" x2="480" y2="542" class="life"/>
  <line x1="800" y1="68" x2="800" y2="542" class="life"/>
  
  <rect x="16" y="96" width="928" height="24" rx="5" class="band"/>
  <text x="28" y="112" class="phase">C1 · GET the card</text>
  <line x1="160" y1="158" x2="473" y2="158" class="msg anim" style="stroke:var(--client);stroke-dasharray:320;animation:d1 14.10s linear infinite"/>
  <g class="anim" style="animation:c1 14.10s linear infinite">
    <polygon points="480,158 471,153 471,163" style="fill:var(--client)"/>
    <text x="320" y="151" class="cap" text-anchor="middle"><tspan class="pname">GET /card</tspan><tspan dx="8">/api/experimental/a2a/card?location[directory]=… · A2A-Version: 1.0</tspan></text>
  </g>
  <g class="pkt anim" style="animation:f1 14.10s linear infinite">
    <rect x="119.5" y="148" width="81" height="20" rx="10" style="fill:var(--client)"/>
    <text x="160" y="162" class="ptext" text-anchor="middle">GET /card</text>
  </g>
  <g class="anim" style="animation:n2 14.10s linear infinite">
    <rect x="302.6" y="183" width="354.8" height="22" rx="5" class="note" style="stroke:var(--server)"/>
    <text x="480" y="198" class="ntext" text-anchor="middle">process.ts authorizedRequest(): Basic auth, else 401</text>
  </g>
  <g class="anim" style="animation:n3 14.10s linear infinite">
    <rect x="350.6" y="217" width="258.8" height="22" rx="5" class="note" style="stroke:var(--server)"/>
    <text x="480" y="232" class="ntext" text-anchor="middle">card(): Flag.enabled("a2a"), else 403</text>
  </g>
  <line x1="480" y1="268" x2="793" y2="268" class="msg anim" style="stroke:var(--server);stroke-dasharray:320;animation:d4 14.10s linear infinite"/>
  <g class="anim" style="animation:c4 14.10s linear infinite">
    <polygon points="800,268 791,263 791,273" style="fill:var(--server)"/>
    <text x="640" y="261" class="cap" text-anchor="middle"><tspan class="pname">list()</tspan><tspan dx="8">Agent.Service.list()</tspan></text>
  </g>
  <g class="pkt anim" style="animation:f4 14.10s linear infinite">
    <rect x="450" y="258" width="60" height="20" rx="10" style="fill:var(--server)"/>
    <text x="480" y="272" class="ptext" text-anchor="middle">list()</text>
  </g>
  <line x1="800" y1="310" x2="487" y2="310" class="msg anim" style="stroke:var(--core);stroke-dasharray:320;animation:d5 14.10s linear infinite"/>
  <g class="anim" style="animation:c5 14.10s linear infinite">
    <polygon points="480,310 489,305 489,315" style="fill:var(--core)"/>
    <text x="640" y="303" class="cap" text-anchor="middle"><tspan class="pname">agents</tspan><tspan dx="8">drop subagents and hidden agents → skills</tspan></text>
  </g>
  <g class="pkt anim" style="animation:f5 14.10s linear infinite">
    <rect x="770" y="300" width="60" height="20" rx="10" style="fill:var(--core)"/>
    <text x="800" y="314" class="ptext" text-anchor="middle">agents</text>
  </g>
  <g class="anim" style="animation:n6 14.10s linear infinite">
    <rect x="318.6" y="335" width="322.8" height="22" rx="5" class="note" style="stroke:var(--server)"/>
    <text x="480" y="350" class="ntext" text-anchor="middle">A2ACodec.card(version, …) · ETag = sha256(json)</text>
  </g>
  <line x1="480" y1="386" x2="167" y2="386" class="msg anim" style="stroke:var(--server);stroke-dasharray:320;animation:d7 14.10s linear infinite"/>
  <g class="anim" style="animation:c7 14.10s linear infinite">
    <polygon points="160,386 169,381 169,391" style="fill:var(--server)"/>
    <text x="320" y="379" class="cap" text-anchor="middle"><tspan class="pname">200 card</tspan><tspan dx="8">Cache-Control: private, max-age=300 · Vary: A2A-Version, Authorization</tspan></text>
  </g>
  <g class="pkt anim" style="animation:f7 14.10s linear infinite">
    <rect x="443" y="376" width="74" height="20" rx="10" style="fill:var(--server)"/>
    <text x="480" y="390" class="ptext" text-anchor="middle">200 card</text>
  </g>
  <rect x="16" y="410" width="928" height="24" rx="5" class="band"/>
  <text x="28" y="426" class="phase">Asking again within the cache window</text>
  <line x1="160" y1="472" x2="473" y2="472" class="msg anim" style="stroke:var(--client);stroke-dasharray:320;animation:d9 14.10s linear infinite"/>
  <g class="anim" style="animation:c9 14.10s linear infinite">
    <polygon points="480,472 471,467 471,477" style="fill:var(--client)"/>
    <text x="320" y="465" class="cap" text-anchor="middle"><tspan class="pname">GET /card</tspan><tspan dx="8">If-None-Match: "&lt;etag&gt;"</tspan></text>
  </g>
  <g class="pkt anim" style="animation:f9 14.10s linear infinite">
    <rect x="119.5" y="462" width="81" height="20" rx="10" style="fill:var(--client)"/>
    <text x="160" y="476" class="ptext" text-anchor="middle">GET /card</text>
  </g>
  <line x1="480" y1="514" x2="167" y2="514" class="msg anim" style="stroke:var(--server);stroke-dasharray:320;animation:d10 14.10s linear infinite"/>
  <g class="anim" style="animation:c10 14.10s linear infinite">
    <polygon points="160,514 169,509 169,519" style="fill:var(--server)"/>
    <text x="320" y="507" class="cap" text-anchor="middle"><tspan class="pname">304</tspan><tspan dx="8">matchesIfNoneMatch() → 304 Not Modified, no body</tspan></text>
  </g>
  <g class="pkt anim" style="animation:f10 14.10s linear infinite">
    <rect x="460.5" y="504" width="39" height="20" rx="10" style="fill:var(--server)"/>
    <text x="480" y="518" class="ptext" text-anchor="middle">304</text>
  </g>
  <text x="16" y="568" class="legend">Pills are messages; boxes are steps inside one component.</text>
</svg>
