<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 772" width="960" height="772" role="img" aria-labelledby="t d">
  <title id="t">GetTask and SubscribeToTask</title>
  <desc id="d">A client that lost its stream reads the task, then follows it again from the current point.</desc>
  <style>
    svg{--bg:#ffffff;--text:#1f2328;--muted:#59636e;--line:#d1d9e0;--band:#f6f8fa;--client:#0969da;--server:#1a7f37;--core:#8250df;--bus:#bc4c00;--remote:#bf3989;--on:#ffffff}
