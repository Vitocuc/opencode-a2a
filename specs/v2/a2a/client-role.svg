<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 882" width="960" height="882" role="img" aria-labelledby="t d">
  <title id="t">OpenCode's a2a tool calling a remote agent</title>
  <desc id="d">The model calls the a2a tool, which reads the remote card once, sends a blocking SendMessage, and polls GetTask until the task settles.</desc>
  <style>
    svg{--bg:#ffffff;--text:#1f2328;--muted:#59636e;--line:#d1d9e0;--band:#f6f8fa;--client:#0969da;--server:#1a7f37;--core:#8250df;--bus:#bc4c00;--remote:#bf3989;--on:#ffffff}
