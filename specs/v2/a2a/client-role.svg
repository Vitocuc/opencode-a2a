    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--text)}
    .bg{fill:var(--bg)}
    .box{fill:var(--bg);stroke-width:1.5}
    .title{font-size:14px;font-weight:600}
    .sub{font-size:11px;fill:var(--muted)}
    .band{fill:var(--band)}
    .phase{font-size:12px;font-weight:600;fill:var(--muted)}
    .life{stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 4}
    .open{fill-opacity:.16}
    .msg{stroke-width:1.75;fill:none}
    .pname{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:700}
    .cap{font-size:11.5px;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
    .note{fill:var(--bg);stroke-width:1.2;stroke-dasharray:3 2}
    .ntext,.ptext{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px}
    .ptext{font-size:11px;font-weight:600;fill:var(--on)}
    .pkt{opacity:0}
    .legend{font-size:11px;fill:var(--muted)}
