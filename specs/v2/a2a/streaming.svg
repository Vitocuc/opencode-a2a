<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 812" width="960" height="812" role="img" aria-labelledby="t d">
  <title id="t">SendStreamingMessage</title>
  <desc id="d">The handler follows live Bus events and turns each finished stretch of text into an SSE artifact chunk, and closes with a chunk that replaces them with the answer.</desc>
  <style>
    svg{--bg:#ffffff;--text:#1f2328;--muted:#59636e;--line:#d1d9e0;--band:#f6f8fa;--client:#0969da;--server:#1a7f37;--core:#8250df;--bus:#bc4c00;--remote:#bf3989;--on:#ffffff}
