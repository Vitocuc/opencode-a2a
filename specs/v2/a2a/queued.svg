<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 814" width="960" height="814" role="img" aria-labelledby="t d">
  <title id="t">Two tasks queued in one context</title>
  <desc id="d">Two non-blocking sends to the same context: the second waits in the inbox, and the first completes when the second is delivered.</desc>
  <style>
    svg{--bg:#ffffff;--text:#1f2328;--muted:#59636e;--line:#d1d9e0;--band:#f6f8fa;--client:#0969da;--server:#1a7f37;--core:#8250df;--bus:#bc4c00;--remote:#bf3989;--on:#ffffff}
