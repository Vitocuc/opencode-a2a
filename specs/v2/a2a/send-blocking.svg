  <rect x="354" y="344" width="12" height="218" rx="3" class="open anim" style="fill:var(--server);animation:b1 18.00s linear infinite"/>
  <rect x="16" y="96" width="928" height="24" rx="5" class="band"/>
  <text x="28" y="112" class="phase">C2 · SendMessage, blocking (the default)</text>
