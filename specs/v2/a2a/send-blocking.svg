    <polygon points="840,352 831,347 831,357" style="fill:var(--server)"/>
    <text x="600" y="345" class="cap" text-anchor="middle"><tspan class="pname">subscribe</tspan><tspan dx="8">settle(): subscribe(progress) before the first read</tspan></text>
  </g>
  <g class="pkt anim" style="animation:f6 18.00s linear infinite">
    <rect x="319.5" y="342" width="81" height="20" rx="10" style="fill:var(--server)"/>
