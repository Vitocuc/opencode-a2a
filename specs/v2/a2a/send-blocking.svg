    <text x="360" y="600" class="ptext" text-anchor="middle">{ task }</text>
  </g>
  <text x="16" y="650" class="legend">Shaded bar: a request still open (client side) or a wait on Bus events (handler side). Pills are messages; boxes are steps inside one component.</text>
</svg>
