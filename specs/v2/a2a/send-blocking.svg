  <rect width="960" height="670" class="bg"/>
  <rect x="12" y="18" width="216" height="50" rx="8" class="box" style="stroke:var(--client)"/>
  <text x="120" y="39" class="title" text-anchor="middle">A2A client</text>
  <text x="120" y="57" class="sub" text-anchor="middle">an a2a-sdk app, or OpenCode's a2a tool</text>
  <rect x="252" y="18" width="216" height="50" rx="8" class="box" style="stroke:var(--server)"/>
  <text x="360" y="39" class="title" text-anchor="middle">A2A handler</text>
  <text x="360" y="57" class="sub" text-anchor="middle">server/src/handlers/a2a.ts</text>
  <rect x="492" y="18" width="216" height="50" rx="8" class="box" style="stroke:var(--core)"/>
  <text x="600" y="39" class="title" text-anchor="middle">Session runtime</text>
  <text x="600" y="57" class="sub" text-anchor="middle">core: Session, Permission, Form</text>
  <rect x="732" y="18" width="216" height="50" rx="8" class="box" style="stroke:var(--bus)"/>
  <text x="840" y="39" class="title" text-anchor="middle">Bus</text>
  <text x="840" y="57" class="sub" text-anchor="middle">live Session and permission events</text>
  <line x1="120" y1="68" x2="120" y2="624" class="life"/>
  <line x1="360" y1="68" x2="360" y2="624" class="life"/>
  <line x1="600" y1="68" x2="600" y2="624" class="life"/>
  <line x1="840" y1="68" x2="840" y2="624" class="life"/>
