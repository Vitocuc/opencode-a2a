  </g>
  <g class="pkt anim" style="animation:f1 18.00s linear infinite">
    <rect x="72.5" y="148" width="95" height="20" rx="10" style="fill:var(--client)"/>
    <text x="120" y="162" class="ptext" text-anchor="middle">SendMessage</text>
  </g>
  <g class="anim" style="animation:n2 18.00s linear infinite">
    <rect x="211.4" y="183" width="297.2" height="22" rx="5" class="note" style="stroke:var(--server)"/>
    <text x="360" y="198" class="ntext" text-anchor="middle">rpc(): A2ACodec.method() → dialect · send()</text>
  </g>
  <line x1="360" y1="234" x2="593" y2="234" class="msg anim" style="stroke:var(--server);stroke-dasharray:240;animation:d3 18.00s linear infinite"/>
