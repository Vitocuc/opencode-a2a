    <text x="600" y="463" class="cap" text-anchor="middle"><tspan class="pname">wake</tspan><tspan dx="8">read(): delivered, no idle yet → working, wait</tspan></text>
  </g>
  <g class="pkt anim" style="animation:f9 18.00s linear infinite">
    <rect x="817" y="460" width="46" height="20" rx="10" style="fill:var(--bus)"/>
