    <text x="480" y="227" class="cap" text-anchor="middle"><tspan class="pname">create</tspan><tspan dx="8">sessions.create({ agent, metadata: { a2a: true } })</tspan></text>
  </g>
  <g class="pkt anim" style="animation:f3 18.00s linear infinite">
    <rect x="330" y="224" width="60" height="20" rx="10" style="fill:var(--server)"/>
