    <rect x="185.79999999999998" y="377" width="348.40000000000003" height="22" rx="5" class="note" style="stroke:var(--server)"/>
    <text x="360" y="392" class="ntext" text-anchor="middle">read(): prompt still in the inbox → submitted, wait</text>
  </g>
  <line x1="600" y1="428" x2="833" y2="428" class="msg anim" style="stroke:var(--core);stroke-dasharray:240;animation:d8 18.00s linear infinite"/>
