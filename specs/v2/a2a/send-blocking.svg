  </g>
  <line x1="360" y1="276" x2="593" y2="276" class="msg anim" style="stroke:var(--server);stroke-dasharray:240;animation:d4 18.00s linear infinite"/>
  <g class="anim" style="animation:c4 18.00s linear infinite">
    <polygon points="600,276 591,271 591,281" style="fill:var(--server)"/>
    <text x="480" y="269" class="cap" text-anchor="middle"><tspan class="pname">prompt</tspan><tspan dx="8">sessions.prompt({ delivery: "queue" }) · taskId = ses:msg</tspan></text>
  </g>
  <g class="pkt anim" style="animation:f4 18.00s linear infinite">
    <rect x="330" y="266" width="60" height="20" rx="10" style="fill:var(--server)"/>
    <text x="360" y="280" class="ptext" text-anchor="middle">prompt</text>
  </g>
  <g class="anim" style="animation:n5 18.00s linear infinite">
    <rect x="432.2" y="301" width="335.6" height="22" rx="5" class="note" style="stroke:var(--core)"/>
    <text x="600" y="316" class="ntext" text-anchor="middle">session.inbox.enqueued → inbox row · runner wakes</text>
  </g>
  <line x1="360" y1="352" x2="833" y2="352" class="msg anim" style="stroke:var(--server);stroke-dasharray:480;animation:d6 18.00s linear infinite"/>
