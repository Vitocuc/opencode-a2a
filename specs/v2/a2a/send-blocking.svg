  </g>
  <line x1="600" y1="512" x2="833" y2="512" class="msg anim" style="stroke:var(--core);stroke-dasharray:240;animation:d10 18.00s linear infinite"/>
  <g class="anim" style="animation:c10 18.00s linear infinite">
    <polygon points="840,512 831,507 831,517" style="fill:var(--core)"/>
    <text x="720" y="505" class="cap" text-anchor="middle"><tspan class="pname">session.execution.succeeded</tspan><tspan dx="8">the turn ends, the Session goes idle</tspan></text>
  </g>
  <g class="pkt anim" style="animation:f10 18.00s linear infinite">
    <rect x="496.5" y="502" width="207" height="20" rx="10" style="fill:var(--core)"/>
    <text x="600" y="516" class="ptext" text-anchor="middle">session.execution.succeeded</text>
  </g>
  <line x1="840" y1="554" x2="367" y2="554" class="msg anim" style="stroke:var(--bus);stroke-dasharray:480;animation:d11 18.00s linear infinite"/>
  <g class="anim" style="animation:c11 18.00s linear infinite">
    <polygon points="360,554 369,549 369,559" style="fill:var(--bus)"/>
    <text x="600" y="547" class="cap" text-anchor="middle"><tspan class="pname">wake</tspan><tspan dx="8">read(): idle after success → completed</tspan></text>
  </g>
  <g class="pkt anim" style="animation:f11 18.00s linear infinite">
    <rect x="817" y="544" width="46" height="20" rx="10" style="fill:var(--bus)"/>
    <text x="840" y="558" class="ptext" text-anchor="middle">wake</text>
  </g>
  <line x1="360" y1="596" x2="127" y2="596" class="msg anim" style="stroke:var(--server);stroke-dasharray:240;animation:d12 18.00s linear infinite"/>
  <g class="anim" style="animation:c12 18.00s linear infinite">
    <polygon points="120,596 129,591 129,601" style="fill:var(--server)"/>
